<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominion Randomizer</title>
    <script src="nl_translations.js" onerror="console.warn('nl_translations.js not found yet')"></script>
    <style>
        :root { --bg: #1e1e2e; --surface: #313244; --text: #cdd6f4; --primary: #cba6f7; --secondary: #89b4fa; --accent: #f38ba8; --border: #45475a; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h1 { font-size: 2.5rem; color: var(--primary); text-shadow: 0 2px 10px rgba(203, 166, 247, 0.3); margin-bottom: 0.5rem; }
        .container { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; max-width: 800px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .control-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-weight: 600; color: var(--secondary); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; }
        select, button { padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1rem; outline: none; transition: all 0.2s; }
        select:focus { border-color: var(--primary); }
        button { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #11111b; font-weight: bold; cursor: pointer; border: none; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.05em; box-shadow: 0 4px 15px rgba(203, 166, 247, 0.4); }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(203, 166, 247, 0.6); }
        button:active { transform: translateY(0); }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 1rem; }
        .checkbox-label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text); font-weight: normal; text-transform: none; }
        input[type="checkbox"] { accent-color: var(--primary); width: 1.2rem; height: 1.2rem; cursor: pointer; }
        .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; margin-top: 2rem; }
        .card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; text-align: center; display: flex; flex-direction: column; gap: 0.5rem; position: relative; overflow: hidden; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: var(--primary); }
        .card.attack { border-color: var(--accent); }
        .card.reaction { border-color: var(--secondary); }
        .card-name { font-weight: bold; font-size: 1.1rem; }
        .card-cost { position: absolute; top: -10px; right: -10px; background: #f9e2af; color: #111; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; }
        .card-types { font-size: 0.8rem; color: #a6adc8; }
        .card-set { font-size: 0.75rem; text-transform: uppercase; color: var(--secondary); margin-top: auto; }
        .theme-badge { background: var(--border); padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.85rem; display: inline-block; margin-bottom: 1rem; color: var(--primary); font-weight: 600; }
        .notification { background: var(--accent); color: #111; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-weight: 600; display: none; align-items: center; gap: 0.5rem; }
    
    .header-bar { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .nav-buttons { display: flex; gap: 1rem; }
    .nav-buttons button { padding: 0.5rem 1rem; font-size: 0.9rem; }
    .lang-switch { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 0.5rem; border-radius: 6px; }
    .info-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; text-align: left; }
    .info-card h3 { margin: 0 0 0.5rem 0; color: var(--primary); display: flex; justify-content: space-between; }
    .info-card p { font-size: 0.9rem; color: var(--text); margin: 0; line-height: 1.4; }
    .filter-bar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; }
    [data-i18n] { transition: opacity 0.2s; }

    @media (max-width: 600px) {
        body { padding: 1rem; }
        .header-bar { flex-direction: column; gap: 1rem; text-align: center; }
        .controls { grid-template-columns: 1fr; }
        h1 { font-size: 2rem; }
        .nav-buttons { flex-wrap: wrap; justify-content: center; }
    }
    </style>
</head>
<body>
    <div class="header-bar">
        <h1 data-i18n="title">Dominion Randomizer</h1>
        <div class="nav-buttons">
            <select class="lang-switch" id="langSwitch" onchange="updateLanguage()">
                <option value="en">EN</option>
                <option value="nl">NL</option>
            </select>
            <button onclick="switchView('randomizer')" data-i18n="nav_randomizer">Randomizer</button>
            <button onclick="switchView('info')" data-i18n="nav_info">Card Info</button>
        </div>
    </div>
    
    <div class="container" id="randomizer-view">
        <div class="controls">
            <div class="control-group">
                <label data-i18n="expansions">Expansions</label>
                <div class="checkbox-group" id="expansions">
                    <span style="color: var(--secondary)" data-i18n="loading">Loading expansions...</span>
                </div>
            </div>
            <div class="control-group">
                <label data-i18n="theme_label">Gameplay Theme</label>
                <select id="theme">
                    <option value="random" data-i18n="theme_random">Random / Balanced</option>
                    <option value="engine" data-i18n="theme_engine">Engine (Actions/Draw)</option>
                    <option value="attack" data-i18n="theme_attack">Attack & Defense</option>
                    <option value="bigmoney" data-i18n="theme_money">Big Money (Treasures)</option>
                </select>
            </div>
            <div class="control-group">
                <label data-i18n="protection_label">Protection Rule</label>
                <label class="checkbox-label"><input type="checkbox" id="requireProtection" checked> <span data-i18n="protection_desc">Force Reaction if Attack is present</span></label>
            </div>
        </div>
        <button onclick="generateSet()" data-i18n="btn_generate">Generate Kingdom</button>
        
        <div id="notification" class="notification">
            ⚠️ <span data-i18n="alert_attack">An Attack card is present! A Reaction card has been included for protection.</span>
        </div>
        <div id="themeDisplay" class="theme-badge" style="display: none;"></div>
        <div class="results" id="results"></div>
    </div>

    <div class="container" id="info-view" style="display: none;">
        <div class="filter-bar">
            <label class="checkbox-label">
                <input type="checkbox" id="filterSelected" onchange="renderInfoPage()"> 
                <span data-i18n="filter_selected">Show only cards in current Kingdom</span>
            </label>
        </div>
        <div id="info-list"></div>
    </div>

    <script>
        const i18n = {
            en: {
                title: "Dominion Randomizer", nav_randomizer: "Randomizer", nav_info: "Card Info",
                expansions: "Expansions", loading: "Loading expansions...", theme_label: "Gameplay Theme",
                theme_random: "Random / Balanced", theme_engine: "Engine (Actions/Draw)", theme_attack: "Attack & Defense", theme_money: "Big Money (Treasures)",
                protection_label: "Protection Rule", protection_desc: "Force Reaction if Attack is present", btn_generate: "Generate Kingdom",
                alert_attack: "An Attack card is present! A Reaction card has been included for protection.",
                filter_selected: "Show only cards in current Kingdom", no_cards: "No cards to display."
            },
            nl: {
                title: "Dominion Willekeurige Set", nav_randomizer: "Willekeurig", nav_info: "Kaart Info",
                expansions: "Uitbreidingen", loading: "Uitbreidingen laden...", theme_label: "Spelthema",
                theme_random: "Willekeurig / Gebalanceerd", theme_engine: "Motor (Acties/Trekken)", theme_attack: "Aanval & Verdediging", theme_money: "Groot Geld (Schatten)",
                protection_label: "Beschermingsregel", protection_desc: "Forceer Reactie als er een Aanval is", btn_generate: "Genereer Koninkrijk",
                alert_attack: "Er is een Aanvalskaart! Een Reactiekaart is toegevoegd ter bescherming.",
                filter_selected: "Toon alleen kaarten in huidige Koninkrijk", no_cards: "Geen kaarten om weer te geven."
            }
        };

        function updateLanguage() {
            const lang = document.getElementById('langSwitch').value;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) el.textContent = i18n[lang][key];
            });
            if (document.getElementById('info-view').style.display !== 'none') renderInfoPage();
        }

        function switchView(view) {
            document.getElementById('randomizer-view').style.display = view === 'randomizer' ? 'block' : 'none';
            document.getElementById('info-view').style.display = view === 'info' ? 'block' : 'none';
            if (view === 'info') renderInfoPage();
        }

        let cardDb = [];
        let currentKingdom = [];

        async function loadCards() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/cypressf/dominion/master/cards.json');
                const data = await response.json();
                
                // Manually append Empires expansion
                data['Empires'] = [
                    { name: 'Archive', cost_treasure: 5, _types: ['Action', 'Duration'], _desc: "Action - Duration" },
                    { name: 'Capital', cost_treasure: 5, _types: ['Treasure'], _desc: "Treasure" },
                    { name: 'Castles', cost_treasure: 3, _types: ['Victory', 'Castle'], _desc: "Victory - Castle" },
                    { name: 'Catapult / Rocks', cost_treasure: 3, _types: ['Action', 'Attack'], _desc: "Action - Attack" },
                    { name: 'Chariot Race', cost_treasure: 3, _types: ['Action'], _desc: "Action" },
                    { name: 'Charm', cost_treasure: 5, _types: ['Treasure'], _desc: "Treasure" },
                    { name: 'City Quarter', cost_treasure: 0, _types: ['Action'], _desc: "Action (8 Debt)" },
                    { name: 'Crown', cost_treasure: 5, _types: ['Action', 'Treasure'], _desc: "Action - Treasure" },
                    { name: 'Encampment / Plunder', cost_treasure: 2, _types: ['Action'], _desc: "Action / Treasure" },
                    { name: 'Enchantress', cost_treasure: 3, _types: ['Action', 'Attack', 'Duration'], _desc: "Action - Attack - Duration" },
                    { name: 'Engineer', cost_treasure: 0, _types: ['Action'], _desc: "Action (4 Debt)" },
                    { name: 'Farmers\' Market', cost_treasure: 3, _types: ['Action', 'Gathering'], _desc: "Action - Gathering" },
                    { name: 'Forum', cost_treasure: 5, _types: ['Action'], _desc: "Action" },
                    { name: 'Gladiator / Fortune', cost_treasure: 3, _types: ['Action'], _desc: "Action / Treasure" },
                    { name: 'Groundskeeper', cost_treasure: 5, _types: ['Action'], _desc: "Action" },
                    { name: 'Legionary', cost_treasure: 5, _types: ['Action', 'Attack'], _desc: "Action - Attack" },
                    { name: 'Overlord', cost_treasure: 0, _types: ['Action'], _desc: "Action (8 Debt)" },
                    { name: 'Patrician / Emporium', cost_treasure: 2, _types: ['Action'], _desc: "Action" },
                    { name: 'Royal Blacksmith', cost_treasure: 0, _types: ['Action'], _desc: "Action (8 Debt)" },
                    { name: 'Sacrifice', cost_treasure: 4, _types: ['Action'], _desc: "Action" },
                    { name: 'Settlers / Bustling Village', cost_treasure: 2, _types: ['Action'], _desc: "Action" },
                    { name: 'Temple', cost_treasure: 4, _types: ['Action', 'Gathering'], _desc: "Action - Gathering" },
                    { name: 'Villa', cost_treasure: 4, _types: ['Action'], _desc: "Action" },
                    { name: 'Wild Hunt', cost_treasure: 5, _types: ['Action', 'Gathering'], _desc: "Action - Gathering" }
                ];
                
                const expansionsDiv = document.getElementById('expansions');
                expansionsDiv.innerHTML = '';
                
                for (const set in data) {
                    const label = document.createElement('label');
                    label.className = 'checkbox-label';
                    label.innerHTML = `<input type="checkbox" value="${set}" ${set === 'Dominion' ? 'checked' : ''}> ${set}`;
                    expansionsDiv.appendChild(label);
                    
                    for (const c of data[set]) {
                        if (c.name.includes('Bogus')) continue;
                        
                        let types = c._types ? c._types : [];
                        if (!c._types) {
                            if (c.is_attack) types.push('Attack');
                            if (c.is_reaction) types.push('Reaction');
                            if (c.treasure > 0 || c.plus_treasure > 0) types.push('Treasure');
                            if (c.victory_points > 0) types.push('Victory');
                            if (types.length === 0) types.push('Action');
                        }
                        
                        cardDb.push({
                            name: c.name,
                            cost: c.cost_treasure || 0,
                            types: types,
                            set: set,
                            description: c.description || c._desc || "No description available."
                        });
                    }
                }
                generateSet();
            } catch (err) {
                console.error("Failed to load cards", err);
                document.getElementById('expansions').innerHTML = '<span style="color:red">Failed to load card database</span>';
            }
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function generateSet() {
            const selectedExpansions = Array.from(document.querySelectorAll('#expansions input:checked')).map(cb => cb.value);
            if (selectedExpansions.length === 0) {
                alert("Please select at least one expansion.");
                return;
            }

            const theme = document.getElementById('theme').value;
            const requireProtection = document.getElementById('requireProtection').checked;

            let pool = cardDb.filter(c => selectedExpansions.includes(c.set));
            
            if (pool.length < 10) {
                alert("Not enough cards in selected expansions! (Need at least 10)");
                return;
            }

            currentKingdom = [];
            let kingdom = currentKingdom;
            let notification = document.getElementById('notification');
            notification.style.display = 'none';

            // Apply Theme Biases
            if (theme === 'engine') {
                const engines = pool.filter(c => c.name === 'Village' || c.name === 'Smithy' || c.name === 'Market' || c.name === 'Bazaar' || c.name === 'Wharff');
                shuffle(engines);
                kingdom.push(...engines.slice(0, 3));
            } else if (theme === 'attack') {
                const attacks = pool.filter(c => c.types.includes('Attack'));
                shuffle(attacks);
                kingdom.push(...attacks.slice(0, 3));
            } else if (theme === 'bigmoney') {
                const moneyCards = pool.filter(c => c.name === 'Mine' || c.name === 'Harem' || c.name === 'Trading Post' || c.name === 'Market');
                shuffle(moneyCards);
                kingdom.push(...moneyCards.slice(0, 3));
            }

            // Fill the rest randomly
            pool = pool.filter(c => !kingdom.includes(c));
            shuffle(pool);
            
            while (kingdom.length < 10 && pool.length > 0) {
                kingdom.push(pool.pop());
            }

            // Check for Protection requirement
            const hasAttack = kingdom.some(c => c.types.includes('Attack'));
            const hasReaction = kingdom.some(c => c.types.includes('Reaction'));

            if (hasAttack && requireProtection && !hasReaction) {
                const reactionCards = cardDb.filter(c => c.types.includes('Reaction') && selectedExpansions.includes(c.set));
                if (reactionCards.length > 0) {
                    shuffle(reactionCards);
                    // Replace a non-attack card with a reaction
                    const replaceIndex = kingdom.findIndex(c => !c.types.includes('Attack'));
                    if (replaceIndex !== -1) {
                        kingdom[replaceIndex] = reactionCards[0];
                        notification.style.display = 'flex';
                    }
                }
            }

            // Sort by cost, then name
            kingdom.sort((a, b) => a.cost - b.cost || a.name.localeCompare(b.name));

            // Render
            renderKingdom();

            const themeNames = { random: 'Balanced Set', engine: 'Engine Theme', attack: 'Attack Heavy Theme', bigmoney: 'Big Money Theme' };
            const themeDisplay = document.getElementById('themeDisplay');
            themeDisplay.textContent = `Current Theme: ${themeNames[theme]}`;
            themeDisplay.style.display = 'inline-block';
        }

        function renderKingdom() {
            const results = document.getElementById('results');
            results.innerHTML = '';
            
            const lang = document.getElementById('langSwitch').value;
            
            currentKingdom.forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = `card ${card.types.includes('Attack') ? 'attack' : ''} ${card.types.includes('Reaction') ? 'reaction' : ''}`;
                
                let displayName = card.name;
                let displayTypes = card.types.join(' - ');
                
                if (lang === 'nl' && window.nlTranslations && window.nlTranslations[card.name]) {
                    displayName = window.nlTranslations[card.name].name || card.name;
                    if(window.nlTypes) {
                        displayTypes = card.types.map(t => window.nlTypes[t] || t).join(' - ');
                    }
                }
                
                cardEl.innerHTML = `
                    <div class="card-cost">${card.cost}</div>
                    <div class="card-name">${displayName}</div>
                    <div class="card-types">${displayTypes}</div>
                    <div class="card-set">${card.set}</div>
                `;
                results.appendChild(cardEl);
            });
        }
        
        function renderInfoPage() {
            const list = document.getElementById('info-list');
            list.innerHTML = '';
            const showOnlySelected = document.getElementById('filterSelected').checked;
            
            let displayCards = cardDb;
            if (showOnlySelected) {
                const kingdomNames = currentKingdom.map(c => c.name);
                displayCards = cardDb.filter(c => kingdomNames.includes(c.name));
            }
            
            // Sort by expansion then name
            displayCards.sort((a, b) => a.set.localeCompare(b.set) || a.name.localeCompare(b.name));
            
            const lang = document.getElementById('langSwitch').value;
            if (displayCards.length === 0) {
                list.innerHTML = `<p>${i18n[lang]['no_cards']}</p>`;
                return;
            }
            
            displayCards.forEach(card => {
                const item = document.createElement('div');
                item.className = 'info-card';
                
                let displayName = card.name;
                let displayDesc = card.description;
                let displayTypes = card.types.join(' - ');
                
                if (lang === 'nl' && window.nlTranslations && window.nlTranslations[card.name]) {
                    displayName = window.nlTranslations[card.name].name || card.name;
                    displayDesc = window.nlTranslations[card.name].description || card.description;
                    if(window.nlTypes) {
                        displayTypes = card.types.map(t => window.nlTypes[t] || t).join(' - ');
                    }
                }
                
                item.innerHTML = `
                    <h3><span>${displayName} (${card.cost}💰)</span> <span style="font-size: 0.8rem; color: var(--text);">${card.set}</span></h3>
                    <div style="font-size: 0.8rem; color: var(--secondary); margin-bottom: 0.5rem;">${displayTypes}</div>
                    <p>${displayDesc}</p>
                `;
                list.appendChild(item);
            });
        }
        
        // Ensure language toggle updates currently rendered views
        const originalUpdateLanguage = updateLanguage;
        window.updateLanguage = function() {
            originalUpdateLanguage();
            if (currentKingdom.length > 0) {
                renderKingdom();
            }
        };
        
        // Initial generation
        updateLanguage();
        loadCards();
    </script>
</body>
</html>
